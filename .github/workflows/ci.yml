name: orchestrator-ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m pytest
      - name: P1 reference E2E
        run: python scripts/certify_p1_reference.py
      - name: P1.1 evidence reference
        run: python scripts/certify_p1_1_reference.py
      - name: Parse Shadow wrappers with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($Path in @(
            "scripts\certify_shadow.ps1",
            "scripts\certify_global_p0.ps1",
            "scripts\certify_p1_shadow.ps1",
            "scripts\certify_p1_1_shadow.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "POWERSHELL_PARSE_FAILED=$Path"
              $errors | Format-List
              exit 1
            }
            Write-Host "POWERSHELL_PARSE=PASS PATH=$Path"
          }

  governance-gate:
    name: governance-gate
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce CI matrix success
        shell: bash
        run: |
          test "${{ needs.test.result }}" = "success"
